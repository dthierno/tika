name: IFT3913 - Tâche 2

on:
  push:
    branches: [ main, 'tache2/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Prepare annotation processor
        run: ./mvnw -B -ntp -pl tika-annotation-processor -am install -Dspotless.goal=check
      - name: Run task 2 tests
        run: >-
          ./mvnw -B -ntp -pl tika-core clean test
          -Dtest='ZeroSizeFileDetector*'
          -Djacoco.append=false -Dspotless.goal=check
      - name: Check forbidden APIs
        run: ./mvnw -B -ntp -pl tika-core de.thetaphi:forbiddenapis:check de.thetaphi:forbiddenapis:testCheck
      - name: Check licenses
        run: ./mvnw -B -ntp -N apache-rat:check
